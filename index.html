<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR model</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        
      body {
  background: url('Hintergrund.jpeg') no-repeat center center fixed;
  background-size: cover;
  color: rgba(0,0,0,0.8);
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100vh;
  margin: 0;
  font-family: 'Garamond', Garamond, 'Times New Roman', Times, serif;
      }

      model-viewer {
  width: 80%;
  height: 50%; /* Ensures it takes 50% of the screen height */
  min-height: 300px; /* Sets a minimum height of 300px */
  max-width: 800px; /* Sets a maximum width of 800px */
  margin: 20px 0;
  background-color: rgba(255, 102, 102, 0.3); /* Transparentes Hellrot */
  flex-shrink: 0; /* Prevents shrinking of the model-viewer */
      }

      .text-box {
        width: 80%; /* Same width as model-viewer */
        padding: 20px;
        margin: 20px 0;
        background-color: white;
        max-width: 800px; /* Sets a maximum width of 800px */
  color: rgba(0,0,0,0.8);
        text-align: left;
        box-sizing: border-box; /* Ensures padding doesn't affect width */
        margin-bottom: 20px;
      }

      h2 {
        margin: 10;
        padding: 10px;
  color: rgba(0,0,0,0.8);
      }
    </style>
  </head>
  <body>
    <div style="width: 90%; max-width: 600px; margin: 32px auto 24px auto; border-radius: 24px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,0.10); border: 2px solid #eee;">
      <img src="Hintergrund.jpeg" alt="Header Bild" style="width: 100%; display: block; object-fit: cover; height: 180px; background: #eee;" />
    </div>
<H2>Poesiebaum</H2>
  <img src="poetry Watching.svg" alt="SVG Dekoration" style="width: 100%; max-width: 300px; display: block; margin: 0 auto 20px auto;" />
  <model-viewer src="Website Objekt.glb"
                ios-src="Website Objekt.usdz"
                alt="Poesiebaum"
                ar
                auto-rotate
                camera-controls
                autoplay
                animation-loop
                animation-name="CubeAction"
                ar-modes="webxr scene-viewer quick-look" 
                environment-image="neutral">   
  </model-viewer>
